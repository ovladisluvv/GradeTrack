name: Build and release executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: GradeTrack-linux-x86_64
          - os: windows-latest
            asset: GradeTrack-windows-x86_64
          - os: macos-15-intel
            asset: GradeTrack-macos-x86_64
          - os: macos-15
            asset: GradeTrack-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller GradeTrack.spec

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          if [ -d GradeTrack.app ]; then
            zip -r "../${{ matrix.asset }}.zip" GradeTrack.app
          else
            zip "../${{ matrix.asset }}.zip" GradeTrack
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/GradeTrack.exe -DestinationPath "${{ matrix.asset }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
